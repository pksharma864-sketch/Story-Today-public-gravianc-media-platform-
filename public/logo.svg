<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004D40" />
      <stop offset="100%" stop-color="#002D25" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background Shield -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" stroke="#80CBC4" stroke-width="8" stroke-opacity="0.4" fill="none" />

  <!-- Newspaper / Editorial Sheet Shadow -->
  <rect x="90" y="80" width="332" height="352" rx="36" fill="#001F19" filter="url(#dropShadow)" />

  <!-- Crisp News Paper Front -->
  <rect x="106" y="92" width="300" height="328" rx="30" fill="#FFFFFF" />

  <!-- Bold Masthead Bar (Red Breaking Header) -->
  <rect x="138" y="124" width="236" height="56" rx="14" fill="url(#accentGrad)" />
  <text x="256" y="162" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">STORY TODAY</text>

  <!-- Editorial Headline Bar -->
  <rect x="138" y="208" width="144" height="28" rx="8" fill="#004D40" />
  <circle cx="346" cy="222" r="14" fill="#10B981" />

  <!-- News Content Article Lines -->
  <rect x="138" y="258" width="236" height="18" rx="6" fill="#1E293B" />
  <rect x="138" y="292" width="236" height="18" rx="6" fill="#475569" />
  <rect x="138" y="326" width="170" height="18" rx="6" fill="#64748B" />
  <rect x="138" y="360" width="120" height="16" rx="6" fill="#94A3B8" />

  <!-- Verified Stamp / Badge -->
  <circle cx="342" cy="352" r="32" fill="#004D40" />
  <path d="M330 352 L338 360 L356 342" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
