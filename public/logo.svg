<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140">
  <defs>
    <!-- Gradients -->
    <linearGradient id="redRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="tealEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00695C" />
      <stop offset="50%" stop-color="#004D40" />
      <stop offset="100%" stop-color="#002D25" />
    </linearGradient>
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softTextShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- 100% TRANSPARENT BACKGROUND - NO BOX, NO CARD, NO CONTAINER -->

  <!-- Left Iconic News Emblem Graphic -->
  <g transform="translate(10, 10)" filter="url(#softTextShadow)">
    <!-- Folded Newspaper / Broadcast Origami 'S' & 'T' Emblem -->
    <!-- Top-left Teal Wing -->
    <path d="M 20 20 L 70 20 L 50 65 L 20 65 Z" fill="url(#tealEmerald)" />
    <!-- Center Red Dynamic Wing -->
    <path d="M 74 20 L 104 20 L 84 65 L 54 65 Z" fill="url(#redRuby)" />
    <!-- Bottom-right Red Wing -->
    <path d="M 54 69 L 104 69 L 84 114 L 34 114 Z" fill="url(#redRuby)" />
    <!-- Bottom-left Gold Accent -->
    <path d="M 14 69 L 50 69 L 30 114 L 14 114 Z" fill="url(#goldSun)" />
    
    <!-- Central Verified News Dot / Signal Pulse -->
    <circle cx="94" cy="24" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Typography: STORY TODAY -->
  <g transform="translate(130, 0)" filter="url(#softTextShadow)">
    <!-- Main Masthead: STORY (Teal) TODAY (Crimson Red) -->
    <text x="0" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#tealEmerald)" letter-spacing="-1">STORY</text>
    <text x="235" y="78" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#redRuby)" letter-spacing="-1">TODAY</text>
    
    <!-- Subtitle Bar -->
    <text x="2" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#004D40" letter-spacing="7">NEWS NETWORK</text>
    
    <!-- Live Broadcast Tag Pill -->
    <circle cx="282" cy="107" r="4" fill="#EF4444" />
    <text x="292" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#E11D48" letter-spacing="2">LIVE</text>
  </g>
</svg>
